<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance</title>
    <!-- Шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Наши стили -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-wave-square"></i>
                <span>Resonance</span>
            </div>
            <nav class="menu">
                <a href="#" class="active"><i class="fa-solid fa-house"></i> Главная</a>
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
                <a href="#"><i class="fa-solid fa-book"></i> Моя медиатека</a>
            </nav>
            <div class="admin-link">
                <a href="#"><i class="fa-solid fa-gear"></i> Админ-панель</a>
            </div>
        </aside>

        <!-- Главная область -->
        <main class="main-content">
            <header class="topbar">
                <h2>Для вас</h2>
                <div class="user-profile">
                    <img src="https://via.placeholder.com/40" alt="Avatar" class="avatar">
                </div>
            </header>

            <section class="tracks-container">
                <!-- Сюда JS будет динамически вставлять треки -->
            </section>
        </main>

        <!-- Нижняя панель плеера -->
        <footer class="player-bar">
            <div class="now-playing">
                <img src="https://via.placeholder.com/50/111" alt="Cover">
                <div class="track-meta">
                    <h4>Не выбрано</h4>
                    <p>—</p>
                </div>
            </div>
            
            <div class="player-controls">
                <div class="buttons">
                    <button><i class="fa-solid fa-backward-step"></i></button>
                    <button class="play-pause"><i class="fa-solid fa-circle-play"></i></button>
                    <button><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-bar">
                    <span class="time current">0:00</span>
                    <input type="range" min="0" max="100" value="0" class="progress-slider">
                    <span class="time total">0:00</span>
                </div>
            </div>

            <div class="volume-controls">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" min="0" max="100" value="80" class="volume-slider">
            </div>
        </footer>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
