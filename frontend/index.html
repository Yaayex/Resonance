<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; display: flex; align-items: center; justify-content: center;
            z-index: 1000; color: white; font-family: 'Montserrat', sans-serif;
        }
        .login-box {
            background: #121212; padding: 40px; border-radius: 8px;
            width: 320px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0; background: #000; 
            border: 1px solid #333; color: white; border-radius: 4px; outline: none;
            font-family: inherit;
        }
        .login-box input:focus { border-color: #8a2be2; }
        .login-box button {
            width: 100%; padding: 12px; background: #8a2be2; border: none; 
            color: white; font-weight: bold; border-radius: 4px; cursor: pointer; 
            margin-top: 15px; transition: 0.3s;
        }
        .login-box button:hover { background: #6a1b9a; }
        
        #main-app { display: none; }
        #admin-link-container { display: none; } 

        .admin-form {
            background: #121212; padding: 25px; border-radius: 8px; max-width: 500px;
        }
        .admin-form label {
            display: block; margin-bottom: 8px; font-weight: 600; color: #a7a7a7; font-size: 14px;
        }
        .admin-form input {
            width: 100%; padding: 12px; margin-bottom: 20px; background: #000; 
            border: 1px solid #333; color: white; border-radius: 4px;
        }
        .admin-form button {
            width: 100%; padding: 12px; background: #8a2be2; border: none; 
            color: white; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s;
        }
        .admin-form button:hover { background: #6a1b9a; }
    </style>
</head>
<body>

    <!-- Экран входа -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="margin-bottom: 5px;"><i class="fa-solid fa-wave-square" style="color: #8a2be2;"></i> Resonance</h2>
            <p style="margin-bottom: 25px; color: #a7a7a7; font-size: 14px;">Вход в систему</p>
            
            <input type="text" id="username-input" placeholder="Логин (например, admin)">
            <input type="password" id="password-input" placeholder="Пароль (например, 123)">
            <button id="login-btn">Войти</button>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="main-app" class="app-container">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-wave-square"></i>
                <span>Resonance</span>
            </div>
            <nav class="menu">
                <a href="#" class="active" id="nav-home"><i class="fa-solid fa-house"></i> Главная</a>
                <a href="#"><i class="fa-solid fa-magnifying-glass"></i> Поиск</a>
                <a href="#"><i class="fa-solid fa-book"></i> Моя медиатека</a>
            </nav>
            
            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 15px;">
                <div class="admin-link" id="admin-link-container">
                    <a href="#" style="color: #8a2be2;" id="nav-admin"><i class="fa-solid fa-gear"></i> Админ-панель</a>
                </div>
                <div class="menu">
                    <a href="#" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Выйти</a>
                </div>
            </div>
        </aside>

        <!-- Главная область -->
        <main class="main-content">
            <header class="topbar">
                <h2 id="page-title">Для вас</h2>
                <div class="user-profile" style="display: flex; align-items: center; gap: 15px;">
                    <span id="user-profile-name" style="font-weight: 600;">Гость</span>
                    <img src="https://via.placeholder.com/40" alt="Avatar" class="avatar">
                </div>
            </header>

            <!-- Список треков -->
            <section class="tracks-container" id="tracks-section"></section>

            <!-- Админ панель -->
            <section id="admin-section" style="display: none;">
                <div class="admin-form">
                    <h3 style="margin-bottom: 20px;">Загрузить новый трек</h3>
                    <form id="upload-form">
                        <label>Название трека</label>
                        <input type="text" name="title" required placeholder="Например: Midnight Drive">
                        
                        <label>Автор (Артист)</label>
                        <input type="text" name="author" required placeholder="Например: Pulse Logistics">
                        
                        <!-- ИЗМЕНЕНИЕ: Теперь это загрузка файла картинки -->
                        <label>Обложка трека (Картинка)</label>
                        <input type="file" name="cover_file" accept="image/*" required>
                        
                        <label>Аудио файл (.mp3)</label>
                        <input type="file" name="audio_file" accept=".mp3" required>
                        
                        <button type="submit"><i class="fa-solid fa-cloud-arrow-up"></i> Загрузить трек</button>
                    </form>
                </div>
            </section>
        </main>

        <!-- Нижняя панель плеера -->
        <footer class="player-bar">
            <div class="now-playing">
                <img src="https://via.placeholder.com/50/111" alt="Cover" id="player-cover">
                <div class="track-meta">
                    <h4 id="player-title">Не выбрано</h4>
                    <p id="player-author">—</p>
                </div>
            </div>
            
            <div class="player-controls">
                <div class="buttons">
                    <button><i class="fa-solid fa-backward-step"></i></button>
                    <button class="play-pause"><i class="fa-solid fa-circle-play"></i></button>
                    <button><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-bar">
                    <span class="time current">0:00</span>
                    <input type="range" min="0" max="100" value="0" class="progress-slider">
                    <span class="time total">0:00</span>
                </div>
            </div>

            <div class="volume-controls">
                <i class="fa-solid fa-volume-high"></i>
                <input type="range" min="0" max="100" value="80" class="volume-slider">
            </div>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
